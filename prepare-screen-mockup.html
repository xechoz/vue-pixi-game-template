<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞行棋 - 开始界面预览</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f4;
      --card: #ffffff;
      --card-border: rgba(0,0,0,0.1);
      --text: rgba(0,0,0,0.95);
      --muted: #615d59;
      --accent: #0075de;
      --accent-dark: #005bab;
      --shadow: 0 4px 18px rgba(0,0,0,0.04), 0 2px 7.8px rgba(0,0,0,0.027), 0 .8px 2.9px rgba(0,0,0,0.02), 0 .2px 1px rgba(0,0,0,0.01);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at top, rgba(0,117,222,0.05), transparent 34%),
        linear-gradient(180deg, #fbfbfa 0%, var(--bg) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .screen {
      width: min(1120px, 100%);
      display: grid;
      gap: 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }
    .brand {
      display: grid;
      gap: 4px;
    }
    .brand .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 9999px;
      background: #f2f9ff;
      color: #097fe8;
      font-size: 13px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .section {
      display: grid;
      gap: 14px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 10px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.03em;
    }
    .section-head span {
      color: var(--muted);
      font-size: 13px;
    }
    .cards {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .card {
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.08);
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      padding: 14px;
      min-height: 118px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .card.active {
      border-color: rgba(0,117,222,0.35);
      box-shadow: 0 0 0 1px rgba(0,117,222,0.06) inset, 0 8px 24px rgba(0,117,222,0.08);
      transform: translateY(-1px);
    }
    .avatars {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
      margin-left: -12px;
      background: #fff;
    }
    .avatar:first-child { margin-left: 0; }
    .mode-card {
      overflow: hidden;
      padding: 0;
    }
    .mode-thumb {
      width: 100%;
      aspect-ratio: 4 / 2.35;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .mode-body {
      padding: 12px 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .mode-body strong {
      font-size: 15px;
    }
    .mode-body small {
      color: var(--muted);
      font-size: 12px;
    }
    .cta-row {
      display: flex;
      justify-content: center;
      padding-top: 4px;
    }
    .start {
      border: 0;
      border-radius: 14px;
      padding: 16px 22px;
      min-width: 220px;
      background: linear-gradient(180deg, var(--accent), var(--accent-dark));
      color: white;
      font: inherit;
      font-weight: 700;
      letter-spacing: .01em;
      box-shadow: 0 10px 30px rgba(0,117,222,0.22);
    }
    .start .arrow { opacity: .9; margin-right: 8px; }
    .mini-note {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-top: -2px;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr 1fr; }
      .topbar { align-items: start; }
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: stretch; }
      .cta-row { justify-content: stretch; }
      .start { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="panel topbar">
      <div class="brand">
        <div class="eyebrow">Flight Ludo</div>
        <h1>飞行棋</h1>
        <p>先选人数，再选模式，然后开始。</p>
      </div>
      <div class="pill">简单 · 快速 · 轻量</div>
    </section>

    <section class="grid">
      <section class="panel section">
        <div class="section-head">
          <h2>玩家数</h2>
          <span>点击头像组</span>
        </div>
        <div class="cards">
          <button class="card active" type="button" aria-label="1人模式">
            <div class="avatars">
              <img class="avatar" src="/player-red.png" alt="红色头像">
            </div>
          </button>
          <button class="card" type="button" aria-label="2人模式">
            <div class="avatars">
              <img class="avatar" src="/player-red.png" alt="红色头像">
              <img class="avatar" src="/player-blue.png" alt="蓝色头像">
            </div>
          </button>
          <button class="card" type="button" aria-label="3人模式">
            <div class="avatars">
              <img class="avatar" src="/player-red.png" alt="红色头像">
              <img class="avatar" src="/player-blue.png" alt="蓝色头像">
              <img class="avatar" src="/player-green.png" alt="绿色头像">
            </div>
          </button>
          <button class="card" type="button" aria-label="4人模式">
            <div class="avatars">
              <img class="avatar" src="/player-red.png" alt="红色头像">
              <img class="avatar" src="/player-blue.png" alt="蓝色头像">
              <img class="avatar" src="/player-green.png" alt="绿色头像">
              <img class="avatar" src="/player-yellow.png" alt="黄色头像">
            </div>
          </button>
        </div>
      </section>

      <section class="panel section">
        <div class="section-head">
          <h2>棋子模式</h2>
          <span>只保留两档</span>
        </div>
        <div class="cards">
          <button class="card mode-card active" type="button" aria-label="快速模式">
            <img class="mode-thumb" src="/prepare-quick-mode.jpg" alt="快速模式图">
            <div class="mode-body">
              <strong>快速</strong>
              <small>2 枚 / 人</small>
            </div>
          </button>
          <button class="card mode-card" type="button" aria-label="正常模式">
            <img class="mode-thumb" src="/prepare-normal-mode.jpg" alt="正常模式图">
            <div class="mode-body">
              <strong>正常</strong>
              <small>4 枚 / 人</small>
            </div>
          </button>
        </div>
      </section>
    </section>

    <section class="panel">
      <div class="cta-row">
        <button class="start" type="button"><span class="arrow">▶</span>开始游戏</button>
      </div>
      <div class="mini-note">点一下就能开始，不需要先看很多文字。</div>
    </section>
  </main>
</body>
</html>
