    <circle cx="500" cy="500" r="150" fill="url(#centerGlow)" stroke="#7dd3fc" stroke-width="8" />
    <circle cx="500" cy="500" r="102" fill="#0f172a" stroke="#475569" stroke-width="5" />
    <circle cx="500" cy="500" r="40" fill="#38bdf8" fill-opacity="0.18" stroke="#67e8f9" stroke-width="4" />
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="487" font-size="34" font-weight="800" fill="#f8fafc">飞行棋</text>
    <text x="500" y="522" font-size="18" font-weight="600" fill="#cbd5e1">中心跑道</text>
    <text x="500" y="548" font-size="12" font-weight="600" fill="#67e8f9">安全区 · 起飞 · 终点</text>
  </g>

  <!-- Player legends -->
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
