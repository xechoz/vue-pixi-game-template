    <rect x="692" y="462" width="60" height="76" rx="14" fill="#f59e0b" fill-opacity="0.12" stroke="#fde68a" />
    <rect x="630" y="462" width="60" height="76" rx="14" fill="#f59e0b" fill-opacity="0.10" stroke="#fde68a" />

    <rect x="462" y="816" width="76" height="60" rx="14" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" />
    <rect x="462" y="754" width="76" height="60" rx="14" fill="#3b82f6" fill-opacity="0.16" stroke="#dbeafe" />
    <rect x="462" y="692" width="76" height="60" rx="14" fill="#3b82f6" fill-opacity="0.12" stroke="#dbeafe" />
    <rect x="462" y="630" width="76" height="60" rx="14" fill="#3b82f6" fill-opacity="0.10" stroke="#dbeafe" />

    <rect x="124" y="462" width="60" height="76" rx="14" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e" />
    <rect x="186" y="462" width="60" height="76" rx="14" fill="#22c55e" fill-opacity="0.16" stroke="#bbf7d0" />
    <rect x="248" y="462" width="60" height="76" rx="14" fill="#22c55e" fill-opacity="0.12" stroke="#bbf7d0" />
    <rect x="310" y="462" width="60" height="76" rx="14" fill="#22c55e" fill-opacity="0.10" stroke="#bbf7d0" />
