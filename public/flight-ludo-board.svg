    <rect x="878" y="334" width="48" height="48" rx="10" fill="#f59e0b" fill-opacity="0.24" stroke="#fde68a" />
    <rect x="878" y="392" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="878" y="450" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="878" y="508" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="878" y="566" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="878" y="624" width="48" height="48" rx="10" fill="#3b82f6" fill-opacity="0.24" stroke="#dbeafe" />
    <rect x="878" y="682" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="878" y="740" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="878" y="798" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="878" y="856" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />

