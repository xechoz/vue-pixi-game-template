<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Flight ludo board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="centerGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" rx="64" fill="url(#bg)"/>
  <rect x="54" y="54" width="892" height="892" rx="48" fill="#0b1220" stroke="#334155" stroke-width="8" filter="url(#shadow)"/>

  <!-- Corner homes -->
  <g opacity="0.96">
    <rect x="70" y="70" width="230" height="230" rx="36" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="8"/>
    <rect x="700" y="70" width="230" height="230" rx="36" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="8"/>
    <rect x="700" y="700" width="230" height="230" rx="36" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="8"/>
    <rect x="70" y="700" width="230" height="230" rx="36" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="8"/>
  </g>

  <!-- Main runway -->
  <g>
    <rect x="310" y="70" width="380" height="860" rx="42" fill="#111827" fill-opacity="0.92" stroke="#475569" stroke-width="5"/>
    <rect x="70" y="310" width="860" height="380" rx="42" fill="#111827" fill-opacity="0.92" stroke="#475569" stroke-width="5"/>
  </g>

  <!-- Tracks -->
  <g fill="#e2e8f0" fill-opacity="0.13" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="3">
    <!-- top row -->
    <rect x="332" y="72" width="50" height="50" rx="10"/>
    <rect x="392" y="72" width="50" height="50" rx="10"/>
    <rect x="452" y="72" width="50" height="50" rx="10"/>
    <rect x="512" y="72" width="50" height="50" rx="10"/>
    <rect x="572" y="72" width="50" height="50" rx="10"/>
    <rect x="632" y="72" width="50" height="50" rx="10"/>
    <!-- right col -->
    <rect x="878" y="332" width="50" height="50" rx="10"/>
    <rect x="878" y="392" width="50" height="50" rx="10"/>
    <rect x="878" y="452" width="50" height="50" rx="10"/>
    <rect x="878" y="512" width="50" height="50" rx="10"/>
    <rect x="878" y="572" width="50" height="50" rx="10"/>
    <rect x="878" y="632" width="50" height="50" rx="10"/>
    <!-- bottom row -->
    <rect x="332" y="878" width="50" height="50" rx="10"/>
    <rect x="392" y="878" width="50" height="50" rx="10"/>
    <rect x="452" y="878" width="50" height="50" rx="10"/>
    <rect x="512" y="878" width="50" height="50" rx="10"/>
    <rect x="572" y="878" width="50" height="50" rx="10"/>
    <rect x="632" y="878" width="50" height="50" rx="10"/>
    <!-- left col -->
    <rect x="72" y="332" width="50" height="50" rx="10"/>
    <rect x="72" y="392" width="50" height="50" rx="10"/>
    <rect x="72" y="452" width="50" height="50" rx="10"/>
    <rect x="72" y="512" width="50" height="50" rx="10"/>
    <rect x="72" y="572" width="50" height="50" rx="10"/>
    <rect x="72" y="632" width="50" height="50" rx="10"/>
  </g>

  <!-- Color lanes -->
  <g stroke-linecap="round" opacity="0.95">
    <line x1="500" y1="150" x2="500" y2="500" stroke="#ef4444" stroke-width="18"/>
    <line x1="500" y1="150" x2="150" y2="500" stroke="#f59e0b" stroke-width="18"/>
    <line x1="500" y1="850" x2="150" y2="500" stroke="#22c55e" stroke-width="18"/>
    <line x1="500" y1="850" x2="850" y2="500" stroke="#3b82f6" stroke-width="18"/>
  </g>

  <!-- Center -->
  <g filter="url(#shadow)">
    <circle cx="500" cy="500" r="138" fill="url(#centerGlow)" stroke="#7dd3fc" stroke-width="8"/>
    <circle cx="500" cy="500" r="96" fill="#0f172a" stroke="#475569" stroke-width="5"/>
    <circle cx="500" cy="500" r="38" fill="#38bdf8" fill-opacity="0.18" stroke="#67e8f9" stroke-width="4"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="488" font-size="34" font-weight="800" fill="#f8fafc">飞行棋</text>
    <text x="500" y="525" font-size="18" font-weight="600" fill="#cbd5e1">中心跑道</text>
  </g>
</svg>
