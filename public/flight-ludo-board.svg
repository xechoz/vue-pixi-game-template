    <rect x="72" y="392" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="72" y="450" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="72" y="508" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="72" y="566" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="72" y="624" width="48" height="48" rx="10" fill="#22c55e" fill-opacity="0.24" stroke="#bbf7d0" />
    <rect x="72" y="682" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="72" y="740" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="72" y="798" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="72" y="856" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
