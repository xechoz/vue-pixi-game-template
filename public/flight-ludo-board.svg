    <rect x="682" y="878" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="740" y="878" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="798" y="878" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />
    <rect x="856" y="878" width="48" height="48" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#cbd5e1" />

