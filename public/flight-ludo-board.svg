<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Flight ludo board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="playfield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="centerGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1000" height="1000" rx="64" fill="url(#bg)" />
  <rect x="54" y="54" width="892" height="892" rx="48" fill="#0b1220" stroke="#334155" stroke-width="8" filter="url(#shadow)" />

  <!-- Main board -->
  <rect x="72" y="72" width="856" height="856" rx="40" fill="url(#playfield)" stroke="#475569" stroke-width="4" />

  <!-- Corner homes -->
  <g opacity="0.98" font-family="Inter, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="72" y="72" width="236" height="236" rx="34" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-width="8" />
    <rect x="692" y="72" width="236" height="236" rx="34" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="8" />
    <rect x="692" y="692" width="236" height="236" rx="34" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="8" />
    <rect x="72" y="692" width="236" height="236" rx="34" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-width="8" />

    <text x="190" y="140" font-size="32" fill="#fecaca">红方</text>
    <text x="810" y="140" font-size="32" fill="#fde68a">黄方</text>
    <text x="810" y="760" font-size="32" fill="#dbeafe">蓝方</text>
    <text x="190" y="760" font-size="32" fill="#bbf7d0">绿方</text>

    <text x="190" y="178" font-size="18" fill="#fecaca" opacity="0.9">起飞区</text>
    <text x="810" y="178" font-size="18" fill="#fde68a" opacity="0.9">起飞区</text>
    <text x="810" y="798" font-size="18" fill="#dbeafe" opacity="0.9">起飞区</text>
    <text x="190" y="798" font-size="18" fill="#bbf7d0" opacity="0.9">起飞区</text>
  </g>

  <!-- Cross runway -->
  <g>
    <rect x="310" y="72" width="380" height="856" rx="38" fill="#111827" fill-opacity="0.94" stroke="#334155" stroke-width="4" />
    <rect x="72" y="310" width="856" height="380" rx="38" fill="#111827" fill-opacity="0.94" stroke="#334155" stroke-width="4" />
  </g>

  <!-- Route arrows -->
